name: Release models

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: model-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tag and catalog before downloading
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/models.py validate --tag "$RELEASE_TAG"
          python scripts/models.py verify --bundled
          python -m unittest discover -s tests -v
      - name: Fetch exact upstream files and create all download assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/models.py fetch
          python scripts/models.py verify
          python scripts/models.py build --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --output dist
          python scripts/models.py verify-release --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --directory dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Recheck complete assets without downloading upstream models
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/models.py verify-release --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --directory dist
      - name: Upload to draft, check remote assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish.py --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --directory dist
